<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterHome Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrapper {
      width: 100%;
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #1e3a8a;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 35px;
      color: #374151;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      text-align: left;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      background: #22c55e;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .top-buttons {
      margin-bottom: 28px;
    }

    .menu-btn {
      display: block;
      width: 100%;
      background: #22c55e;
      color: white;
      text-decoration: none;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 22px;
    }

    .menu-btn:hover {
      background: #16a34a;
    }

    .success-message {
      margin-top: 15px;
      color: #166534;
      font-weight: bold;
    }

    .reports-title {
      text-align: left;
      margin-bottom: 15px;
      color: #1e3a8a;
    }

    .report-item {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: left;
    }

    .report-item h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #111827;
    }

    .empty-text {
      color: #6b7280;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>BetterHome Prototype</h1>
    <p class="subtitle">Apartment issue reporting and tracking platform</p>

    <div class="top-buttons">
      <a href="#" class="menu-btn">Report New Issue</a>
      <a href="#" class="menu-btn">View My Reports</a>
      <a href="#" class="menu-btn">Landlord Dashboard</a>
    </div>

    <div class="card">
      <form id="issueForm">
        <label for="category">Issue Category</label>
        <select id="category" required>
          <option value="">Select an issue</option>
          <option>Mold</option>
          <option>Leak</option>
          <option>Pest</option>
          <option>Broken Appliance</option>
          <option>Heating Problem</option>
          <option>Other</option>
        </select>

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="Example: Bathroom ceiling" required />

        <label for="description">Description</label>
        <textarea id="description" placeholder="Describe the apartment issue..." required></textarea>

        <label for="photo">Upload Photo</label>
        <input type="file" id="photo" />

        <button type="submit">Submit Issue Report</button>
        <p id="successMessage" class="success-message"></p>
      </form>
    </div>

    <div class="card">
      <h2 class="reports-title">Submitted Reports</h2>
      <div id="reportsList">
        <p class="empty-text">No reports submitted yet.</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("issueForm");
    const reportsList = document.getElementById("reportsList");
    const successMessage = document.getElementById("successMessage");

    function loadReports() {
      const savedReports = JSON.parse(localStorage.getItem("betterHomeReports")) || [];

      reportsList.innerHTML = "";

      if (savedReports.length === 0) {
        reportsList.innerHTML = '<p class="empty-text">No reports submitted yet.</p>';
        return;
      }

      savedReports.forEach(function(report) {
        const reportDiv = document.createElement("div");
        reportDiv.classList.add("report-item");

        reportDiv.innerHTML = `
          <h3>${report.category}</h3>
          <p><strong>Location:</strong> ${report.location}</p>
          <p><strong>Description:</strong> ${report.description}</p>
          <p><strong>Status:</strong> Open</p>
        `;

        reportsList.appendChild(reportDiv);
      });
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const category = document.getElementById("category").value;
      const location = document.getElementById("location").value;
      const description = document.getElementById("description").value;

      const newReport = {
        category: category,
        location: location,
        description: description
      };

      const savedReports = JSON.parse(localStorage.getItem("betterHomeReports")) || [];
      savedReports.push(newReport);
      localStorage.setItem("betterHomeReports", JSON.stringify(savedReports));

      form.reset();
      successMessage.textContent = "Issue report submitted successfully.";
      loadReports();
    });

    loadReports();
  </script>
</body>
</html>
