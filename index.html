<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterHome Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrapper {
      width: 100%;
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 62px;
      margin-bottom: 8px;
      color: #1e3a8a;
    }

    .subtitle {
      font-size: 24px;
      margin-bottom: 40px;
      color: #374151;
    }

    .menu-btn {
      display: block;
      width: 100%;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 24px;
      font-size: 28px;
      margin-bottom: 18px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .menu-btn:hover {
      background: #16a34a;
    }

    .section {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      text-align: left;
      margin-top: 20px;
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-top: 0;
      color: #1e3a8a;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    input[type="text"],
    textarea,
    select,
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-btn,
    .back-btn,
    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      color: white;
    }

    .submit-btn {
      width: 100%;
      margin-top: 18px;
      background: #16a34a;
    }

    .submit-btn:hover {
      background: #15803d;
    }

    .back-btn {
      background: #2563eb;
      margin-bottom: 20px;
    }

    .back-btn:hover {
      background: #1d4ed8;
    }

    .status-btn {
      background: #f59e0b;
    }

    .delete-btn {
      background: #dc2626;
    }

    .success-message {
      margin-top: 14px;
      color: #166534;
      font-weight: bold;
    }

    .empty-text {
      color: #6b7280;
    }

    .report-item {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .report-item h3 {
      margin-top: 0;
      color: #111827;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      background: #dbeafe;
      color: #1d4ed8;
      margin-top: 8px;
    }

    .report-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .preview-image,
    .report-image {
      width: 100%;
      max-width: 220px;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      display: block;
    }

    #homeScreen.active {
      display: block;
    }

    .home-screen {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="homeScreen" class="home-screen active">
      <h1>BetterHome Prototype</h1>
      <p class="subtitle">Apartment issue reporting and tracking platform</p>

      <button class="menu-btn" onclick="showSection('reportSection')">Report New Issue</button>
      <button class="menu-btn" onclick="showSection('myReportsSection')">View My Reports</button>
      <button class="menu-btn" onclick="showSection('landlordSection')">Landlord Dashboard</button>
    </div>

    <div id="reportSection" class="section">
      <button class="back-btn" onclick="goHome()">← Back to Home</button>
      <h2>Report New Issue</h2>

      <form id="issueForm">
        <label for="category">Issue Category</label>
        <select id="category" required>
          <option value="">Select an issue</option>
          <option>Mold</option>
          <option>Leak</option>
          <option>Pest</option>
          <option>Broken Heater</option>
          <option>Electrical Problem</option>
          <option>Broken Appliance</option>
          <option>Other</option>
        </select>

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="Example: Bathroom ceiling" required />

        <label for="description">Description</label>
        <textarea id="description" placeholder="Describe the apartment issue..." required></textarea>

        <label for="photo">Upload Photo</label>
        <input type="file" id="photo" accept="image/*" />

        <img id="photoPreview" class="preview-image" style="display:none;" alt="Photo preview" />

        <button type="submit" class="submit-btn">Submit Issue Report</button>
        <p id="successMessage" class="success-message"></p>
      </form>
    </div>

    <div id="myReportsSection" class="section">
      <button class="back-btn" onclick="goHome()">← Back to Home</button>
      <h2>View My Reports</h2>
      <div id="myReportsList">
        <p class="empty-text">No reports submitted yet.</p>
      </div>
    </div>

    <div id="landlordSection" class="section">
      <button class="back-btn" onclick="goHome()">← Back to Home</button>
      <h2>Landlord Dashboard</h2>
      <div id="landlordReportsList">
        <p class="empty-text">No reports available yet.</p>
      </div>
    </div>
  </div>

  <script>
    const homeScreen = document.getElementById("homeScreen");
    const sections = document.querySelectorAll(".section");
    const form = document.getElementById("issueForm");
    const photoInput = document.getElementById("photo");
    const photoPreview = document.getElementById("photoPreview");
    const successMessage = document.getElementById("successMessage");
    const myReportsList = document.getElementById("myReportsList");
    const landlordReportsList = document.getElementById("landlordReportsList");

    let uploadedImageData = "";

    function showSection(sectionId) {
      homeScreen.classList.remove("active");
      homeScreen.style.display = "none";

      sections.forEach(section => {
        section.classList.remove("active");
        section.style.display = "none";
      });

      const selectedSection = document.getElementById(sectionId);
      selectedSection.classList.add("active");
      selectedSection.style.display = "block";

      renderAllReports();
    }

    function goHome() {
      sections.forEach(section => {
        section.classList.remove("active");
        section.style.display = "none";
      });

      homeScreen.classList.add("active");
      homeScreen.style.display = "block";
    }

    photoInput.addEventListener("change", function () {
      const file = photoInput.files[0];

      if (!file) {
        uploadedImageData = "";
        photoPreview.src = "";
        photoPreview.style.display = "none";
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        uploadedImageData = e.target.result;
        photoPreview.src = uploadedImageData;
        photoPreview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    function getReports() {
      return JSON.parse(localStorage.getItem("betterHomeReports")) || [];
    }

    function saveReports(reports) {
      localStorage.setItem("betterHomeReports", JSON.stringify(reports));
    }

    function renderMyReports() {
      const reports = getReports();
      myReportsList.innerHTML = "";

      if (reports.length === 0) {
        myReportsList.innerHTML = '<p class="empty-text">No reports submitted yet.</p>';
        return;
      }

      reports.forEach(report => {
        const div = document.createElement("div");
        div.classList.add("report-item");

        div.innerHTML = `
          <h3>${report.category}</h3>
          <p><strong>Location:</strong> ${report.location}</p>
          <p><strong>Description:</strong> ${report.description}</p>
          <p><strong>Date Submitted:</strong> ${report.date}</p>
          <p><strong>Status:</strong> <span class="status-badge">${report.status}</span></p>
          ${report.photo ? `<img src="${report.photo}" class="report-image" alt="Issue image">` : ""}
        `;

        myReportsList.appendChild(div);
      });
    }

    function renderLandlordReports() {
      const reports = getReports();
      landlordReportsList.innerHTML = "";

      if (reports.length === 0) {
        landlordReportsList.innerHTML = '<p class="empty-text">No reports available yet.</p>';
        return;
      }

      reports.forEach((report, index) => {
        const div = document.createElement("div");
        div.classList.add("report-item");

        div.innerHTML = `
          <h3>${report.category}</h3>
          <p><strong>Location:</strong> ${report.location}</p>
          <p><strong>Description:</strong> ${report.description}</p>
          <p><strong>Date Submitted:</strong> ${report.date}</p>
          <p><strong>Status:</strong> <span class="status-badge">${report.status}</span></p>
          ${report.photo ? `<img src="${report.photo}" class="report-image" alt="Issue image">` : ""}
          <div class="report-actions">
            <button class="action-btn status-btn" onclick="toggleStatus(${index})">Change Status</button>
            <button class="action-btn delete-btn" onclick="deleteReport(${index})">Delete</button>
          </div>
        `;

        landlordReportsList.appendChild(div);
      });
    }

    function renderAllReports() {
      renderMyReports();
      renderLandlordReports();
    }

    function toggleStatus(index) {
      const reports = getReports();
      const currentStatus = reports[index].status;

      if (currentStatus === "Open") {
        reports[index].status = "In Progress";
      } else if (currentStatus === "In Progress") {
        reports[index].status = "Resolved";
      } else {
        reports[index].status = "Open";
      }

      saveReports(reports);
      renderAllReports();
    }

    function deleteReport(index) {
      const reports = getReports();
      reports.splice(index, 1);
      saveReports(reports);
      renderAllReports();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const category = document.getElementById("category").value;
      const location = document.getElementById("location").value.trim();
      const description = document.getElementById("description").value.trim();

      const newReport = {
        category,
        location,
        description,
        status: "Open",
        date: new Date().toLocaleDateString(),
        photo: uploadedImageData
      };

      const reports = getReports();
      reports.push(newReport);
      saveReports(reports);

      form.reset();
      uploadedImageData = "";
      photoPreview.src = "";
      photoPreview.style.display = "none";
      successMessage.textContent = "Issue report submitted successfully.";

      renderAllReports();
    });

    renderAllReports();
  </script>
</body>
</html>
