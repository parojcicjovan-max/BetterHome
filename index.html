<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterHome Prototype</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrapper {
      width: 100%;
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }

    h1 { font-size: 56px; color: #1e3a8a; }

    .subtitle {
      font-size: 22px;
      margin-bottom: 35px;
      color: #374151;
    }

    .menu-btn {
      width: 100%;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 24px;
      font-size: 26px;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .menu-btn:hover { background: #16a34a; }

    .section {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 20px;
    }

    .section.active { display: block; }

    label { display: block; margin: 16px 0 8px; font-weight: bold; }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    textarea { min-height: 110px; }

    .submit-btn, .back-btn, .action-btn {
      border: none;
      border-radius: 10px;
      padding: 12px;
      color: white;
      cursor: pointer;
    }

    .submit-btn { background: #16a34a; width: 100%; }
    .back-btn { background: #2563eb; margin-bottom: 20px; }
    .status-btn { background: #f59e0b; }
    .delete-btn { background: #dc2626; }

    .success-message { color: green; margin-top: 10px; }
    .error-message { color: red; margin-top: 10px; }

    .report-item {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .status-badge {
      background: #dbeafe;
      padding: 5px 10px;
      border-radius: 20px;
      margin-left: 5px;
    }

    img { max-width: 200px; margin-top: 10px; }

    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      .menu-btn { font-size: 20px; padding: 18px; }
    }
  </style>
</head>

<body>
<div class="wrapper">

<div id="homeScreen">
  <h1>BetterHome</h1>
  <p class="subtitle">Apartment issue reporting</p>

  <button class="menu-btn" onclick="showSection('report')">Report Issue</button>
  <button class="menu-btn" onclick="showSection('my')">My Reports</button>
  <button class="menu-btn" onclick="showSection('landlord')">Landlord</button>
</div>

<div id="report" class="section">
  <button class="back-btn" onclick="goHome()">Back</button>

  <form id="form">
    <label>Category</label>
    <select id="category" required>
      <option value="">Select</option>
      <option>Mold</option>
      <option>Leak</option>
      <option>Pest</option>
      <option>Other</option>
    </select>

    <label>Location</label>
    <input id="location" required minlength="3" maxlength="80">

    <label>Description</label>
    <textarea id="desc" required minlength="10" maxlength="500"></textarea>

    <label>Photo</label>
    <input type="file" id="photo" accept="image/*">

    <img id="preview" style="display:none;">

    <button class="submit-btn">Submit</button>
    <p id="ok" class="success-message"></p>
    <p id="err" class="error-message"></p>
  </form>
</div>

<div id="my" class="section">
  <button class="back-btn" onclick="goHome()">Back</button>
  <div id="myList"></div>
</div>

<div id="landlord" class="section">
  <button class="back-btn" onclick="goHome()">Back</button>
  <div id="allList"></div>
</div>

</div>

<script>
let imgData = "";

function showSection(id){
  document.getElementById("homeScreen").style.display="none";
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  render();
}

function goHome(){
  document.getElementById("homeScreen").style.display="block";
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
}

function getData(){
  return JSON.parse(localStorage.getItem("data"))||[];
}

function saveData(d){
  localStorage.setItem("data",JSON.stringify(d));
}

document.getElementById("photo").onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;

  if(f.size > 2*1024*1024){
    alert("Image too big");
    return;
  }

  const r = new FileReader();
  r.onload = x=>{
    imgData = x.target.result;
    preview.src = imgData;
    preview.style.display="block";
  };
  r.readAsDataURL(f);
};

form.onsubmit = e=>{
  e.preventDefault();
  err.textContent="";
  ok.textContent="";

  const c = category.value;
  const l = location.value.trim();
  const d = desc.value.trim();

  if(l.length<3){ err.textContent="Location too short"; return; }
  if(d.length<10){ err.textContent="Description too short"; return; }

  const data = getData();
  data.push({
    c,l,d,
    s:"Open",
    date:new Date().toLocaleDateString(),
    img:imgData
  });

  saveData(data);
  form.reset();
  imgData="";
  preview.style.display="none";
  ok.textContent="Submitted";
  render();
};

function render(){
  const data = getData();
  myList.innerHTML="";
  allList.innerHTML="";

  data.forEach((r,i)=>{
    const div=document.createElement("div");
    div.className="report-item";

    div.innerHTML=`
      <h3>${r.c}</h3>
      <p>${r.l}</p>
      <p>${r.d}</p>
      <p>${r.date}</p>
      <span class="status-badge">${r.s}</span>
      ${r.img?`<img src="${r.img}">`:``}
    `;

    myList.appendChild(div);

    const div2=div.cloneNode(true);

    const btn=document.createElement("button");
    btn.className="action-btn status-btn";
    btn.innerText="Change";
    btn.onclick=()=>{
      r.s = r.s==="Open"?"Done":"Open";
      saveData(data);
      render();
    };

    const del=document.createElement("button");
    del.className="action-btn delete-btn";
    del.innerText="Delete";
    del.onclick=()=>{
      data.splice(i,1);
      saveData(data);
      render();
    };

    div2.appendChild(btn);
    div2.appendChild(del);
    allList.appendChild(div2);
  });
}

render();
</script>

</body>
</html>
