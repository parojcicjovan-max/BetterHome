<!DOCTYPE html>
<html>

<head>
<title>BetterHome Prototype</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4f6f8;
text-align:center;
margin-top:80px;
}

.container{
width:450px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
color:#1e3a8a;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:25px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
background:#22c55e;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

</style>

</head>

<body>

<div class="container">

<h1>BetterHome Prototype</h1>

<p>Report apartment issues easily</p>

<form>

<label>Issue Category</label>

<select>
<option>Mold</option>
<option>Leak</option>
<option>Pest</option>
<option>Broken Appliance</option>
<option>Heating Problem</option>
<option>Other</option>
</select>

<label>Location</label>

<input type="text" placeholder="Example: Bathroom ceiling">

<label>Description</label>

<textarea placeholder="Describe the problem..."></textarea>

<label>Upload Photo</label>

<input type="file">

<button type="submit">Submit Issue Report</button>

</form>

</div>

<script>

document.querySelector("form").addEventListener("submit", function(e){

e.preventDefault();

alert("Issue report submitted successfully.");

});

</script>

</body>
</html>
