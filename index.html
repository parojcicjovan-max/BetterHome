<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BetterHome</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#e0f2fe,#f8fafc,#dcfce7);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

h1{
color:#1e3a8a;
margin-bottom:10px;
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:16px;
color:white;
background:linear-gradient(135deg,#2563eb,#16a34a);
cursor:pointer;
}

.tab{
display:flex;
gap:10px;
margin-bottom:15px;
}

.tab button{
background:#ddd;
color:black;
}

.tab button.active{
background:#2563eb;
color:white;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="card">

<h1>BetterHome</h1>

<div class="tab">
<button id="loginBtn" class="active">Login</button>
<button id="signupBtn">Sign Up</button>
</div>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div id="signupFields" class="hidden">
<input id="name" placeholder="Full name">
<select id="role">
<option value="tenant">Tenant</option>
<option value="landlord">Landlord</option>
</select>
</div>

<button id="mainBtn">Login</button>

<p id="msg"></p>

</div>

<script>

const client = window.supabase.createClient(
"https://snltjzmkgxtjpeadlpna.supabase.co",
"sb_publishable_frhRltGUxG1Ap_FTMuXCxg_Y3UsMqrd"
);

let mode="login";

loginBtn.onclick=()=>{
mode="login";
signupFields.classList.add("hidden");
mainBtn.innerText="Login";
loginBtn.classList.add("active");
signupBtn.classList.remove("active");
}

signupBtn.onclick=()=>{
mode="signup";
signupFields.classList.remove("hidden");
mainBtn.innerText="Create Account";
signupBtn.classList.add("active");
loginBtn.classList.remove("active");
}

mainBtn.onclick=async()=>{

msg.innerText="";

if(mode==="signup"){

const {data,error}=await client.auth.signUp({
email:email.value,
password:password.value
});

if(error)return msg.innerText=error.message;

await client.from("profiles").insert({
id:data.user.id,
full_name:name.value,
role:role.value
});

msg.innerText="Account created ✔";

}else{

const {data,error}=await client.auth.signInWithPassword({
email:email.value,
password:password.value
});

if(error)return msg.innerText=error.message;

msg.innerText="LOGIN SUCCESS ✔";
}

}

</script>

</body>
</html>
