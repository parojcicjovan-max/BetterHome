<!DOCTYPE html>
<html>
<head>
<title>BetterHome Prototype</title>
</head>
  <style>

body{
font-family: Arial;
background:#f4f6f8;
text-align:center;
margin-top:60px;
}

form{
background:white;
padding:20px;
width:400px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
margin-top:10px;
margin-bottom:10px;
padding:8px;
}

button{
background:#2563eb;
color:white;
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

<body>

<h1>BetterHome</h1>

<h2>Report Apartment Issue</h2>

<form>

<label>Category</label>
<select>
<option>Mold</option>
<option>Leak</option>
<option>Pest</option>
<option>Broken Appliance</option>
</select>

<br><br>

<label>Location</label>
<input type="text">

<br><br>

<label>Description</label>
<textarea></textarea>

<br><br>

<label>Upload Photo</label>
<input type="file">

<br><br>

<button type="submit">Submit Report</button>

</form>

</body>
</html>
